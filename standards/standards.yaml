    },
    {
      "Review Ref": "S-D37",
      "Scope": "COS",
      "Standard Name": "Shared-drive-only storage and local-file approval",
      "Rule": "Shared-drive-only storage applies across COS and MHL chats and projects. Use native Google Docs and Google Sheets under the approved shared-drive root https://drive.google.com/drive/folders/1KmWT6rD0EMBIDFIioE5KMShGB4Kb9u7y. Do not create or save deliverables in My Drive. Do not create local files, temporary local build/export files, Excel files or downloadable artifacts without explicit documented approval from ashish.maan@mannhospitality.com (main user/workspace authority). Do not treat a tool or skill default as approval. If the native shared-drive route cannot complete a task, stop before the prohibited operation and request that approval. Any user-specific local-file standard is maintained separately in that user's workspace and remains subject to this approval requirement. Current draft destination: https://drive.google.com/drive/folders/1Ihxx88hRxupD41ve6aEw6OINY2mudHAi. Global applicability is a governance requirement; recording it does not automatically configure or enforce other chats or projects.",
      "Decision Ref": "D37",
      "Version": "0.1.0",
      "Approval Status": "Approved"
    },
    {
      "Review Ref": "S-D38",
      "Scope": "COS",
      "Standard Name": "User-readable date format",
      "Rule": "Use DD-MMM-YYYY for user-readable date displays and the date portion of timestamps, for example 20-Oct-2026. Preserve typed date/timestamp values; apply display formatting rather than replacing underlying values with text. This instruction specifies the date format only; time-of-day format and same-day backup filename uniqueness remain unresolved. Existing files are not renamed and historical records are not rewritten by this registration.",
      "Decision Ref": "D38",
      "Version": "0.1.0",
      "Approval Status": "Approved",
      "Current_Disposition": "Historical wording retained. DATE-TIME-01 and BACKUP-TIME-01 resolve display time and backup timestamp; only same-second backup collisions remain pending."
    },
    {
      "Review Ref": "S-D39",
      "Scope": "COS",
      "Standard Name": "Dual identifiers",
      "Rule": "Retain both a UUID and a readable prefixed ID for registered records. Any later removal requires dependency review and an approved migration.",
      "Decision Ref": "D39",
      "Version": "0.1.0",
      "Approval Status": "Approved"
    },
    {
      "Review Ref": "S-D40",
      "Scope": "COS",
      "Standard Name": "Relational keys",
      "Rule": "Proposed schema uses immutable UUID primary keys and UUID foreign keys. Readable IDs are unique alternate keys; relationships are stored explicitly rather than inferred from ID text.",
      "Decision Ref": "D40",
      "Version": "0.1.0",
      "Approval Status": "Pending"
    },
    {
      "Review Ref": "S-D41",
