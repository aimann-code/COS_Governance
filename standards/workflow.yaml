    "compatibility": "feat means feature; existing draft/* or feat/* branches are not automatically renamed.",
    "no_automatic_sync": true,
    "read_protocol": [
      "Read cos-governance.yaml and AGENTS.md, then relevant definitions.",
      "Record repository, branch and resolved commit at session start.",
      "Default reads may select main; explicitly select the branch for draft work.",
      "Check source inventory/aliases before declaring an architecture object absent.",
      "Refresh head before each write and reconcile changes; update refs using expected SHA.",
      "Report commit, branch, changed paths and actual checks after each approved write."
    ],
    "write_protocol": "Before each GitHub update, reconcile available approval evidence and show: (1) approved changes included, (2) pending approvals and ambiguous decisions, (3) excluded items, and (4) proposed content/change summary. Ask Any pending approvals to resolve before this update? and then Update Git Hub - Yes/No? Wait for an affirmative instruction for the stated scope; do not repeatedly request the same approval once given. Resolve blocking ambiguity or explicitly agree its exclusion before dependent changes. Update approval labels only with traceable evidence; preserve history and keep approval, publication, implementation and verification separate. Authorization covers necessary commits, generated views and checks for that scope, not unrelated edits, merging, deployment or access changes. Read-only checks need no update approval.",
    "handover_protocol": "After approved baseline publication, link its immutable commit and paths to the developer work item. Other chats must reread GitHub; open chats do not receive automatic updates."
