  "standard": "Naming Standard",
  "version": "0.2.3",
  "status": "frozen base with user-authorized scoped registration/source/mart naming additions; not published",
  "decision_ref": "NAM-DOC-01",
  "approval_evidence": "User yes update github to displayed architecture, filenames and lifecycle update; 23-Oct-2026",
