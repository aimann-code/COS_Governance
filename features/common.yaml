{
  "version": "0.1.0",
  "status": "Recorded cross-suite requirements and design directions; not implemented or published",
  "scope": "All subscribed suites, engines, modules and components, subject to domain applicability",
  "source_ref": "COMMON-REQ-01",
  "approval": "User update git hub after displayed requirements and refinements",
  "source_evidence": "discussions/common-requirements-23-Oct-2026.md",
  "groups": [
    {
      "ref": "COMMON-UNIQUE",
      "name": "Configurable uniqueness",
      "requirements": [
        {
          "ref": "COMMON-UNIQUE-01",
          "text": "Entity administrators configure uniqueness for employee, vendor, aggregator and user business profiles. COS controls entity-registration uniqueness. Login authentication identity remains distinct from business-profile matching.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-02",
          "text": "Employee candidate fields include Name, Father's Name, DOB, Number, email, PAN, Aadhaar and national identity. Do not freeze one combination in code. The meaning of Number remains pending.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-03",
          "text": "Every active unique key contains at least two selected fields. All selected values are mandatory for the operation. Treat the combination as one match; separate matches to different records do not identify one record.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-04",
          "text": "Configure record type, entity scope, normalization, blank handling, duplicate detection outcome, default key, approved alternative keys and effective version. No literal field combination is selected as the default by this requirement; the entity administrator must choose it.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-05",
          "text": "All update sources require the configured complete key and exactly one matching record. Do not fall back to name-only, source row number or close-record matching. Zero matches block update; creation requires explicit permitted create mode. Multiple matches block update for review. Duplicate create outcomes may be configurable, but update matching cannot bypass these gates.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-06",
          "text": "With one selected field show Select at least one more field and disable activation. With two or more preview matching behaviour. Selected optional fields become mandatory where that key applies; explain this.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-07",
          "text": "Warn on mutable or commonly shared key fields. Mask sensitive values and use protected comparison data. Audit authorized changes.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-08",
          "text": "Before activation, scan existing records for missing/invalid selected values and duplicates. Show access-permitted affected counts/details; block activation until conflicts are resolved.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-09",
          "text": "Changing an active key creates a version, previews affected forms/mappings/APIs/sync profiles, requires confirmation, and retains previous configuration/history. Safely handle simultaneous updates and stale record versions.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-10",
          "text": "Changing key values requires the existing key plus proposed values, duplicate validation and confirmation. Keep immutable internal record IDs unchanged.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-UNIQUE-11",
          "text": "Show row outcomes Matched, Not found, Missing key, Multiple matches or Invalid key. Missing values/columns and complete-key-no-match are distinct errors; never invent a missing field when all key inputs are present.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-FIELD",
      "name": "Entity field and form control",
      "requirements": [
        {
          "ref": "COMMON-FIELD-01",
          "text": "Entity administrator configuration supports Entity, Suite, Engine, Module, Component and Field selection across all subscribed capabilities.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-FIELD-02",
          "text": "Configure field availability, labels/descriptions, order/grouping, required/optional state, defaults, read-only state, formats/ranges, allowed values and dependent fields.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-FIELD-03",
          "text": "Configure form layout, parent-field filtering, permitted field selection and component-specific validation. Preserve field business meaning separately from physical schema.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-FIELD-04",
          "text": "System owns all fields and authoritative data. Google Sheets is an input/output interface whose changes pass system validation, source matching and access checks.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-FIELD-05",
          "text": "Distinguish platform-managed identity/security/relationship controls. Label changes do not silently rename database keys. Disabling a field must not silently destroy existing data.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-FIELD-06",
          "text": "Maintain separate configuration, field-definition and data-value history, including actor, time, scope, source and effective version.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-ACCESS",
      "name": "Access groups",
      "requirements": [
        {
          "ref": "COMMON-ACCESS-01",
          "text": "Entity owner has full access within its own entity and subscription; no cross-entity or COS administration rights follow automatically.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-02",
          "text": "Entity administrator receives administration permissions through an admin access group. Create access groups and assign one or more groups to users.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-03",
          "text": "Group permission selection supports Suite, Engine, Module, Component and Field, with read/write permissions.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-04",
          "text": "Check all hierarchy levels, field access, entity boundaries and record scope in both frontend and backend. Labels do not reveal protected fields or metadata.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-05",
          "text": "Apply the same effective permissions to APIs, search, dashboards, reports, downloads, imports, mappings, email extraction and Google Sheet input/output. Frontend hiding alone is insufficient.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-06",
          "text": "Subscription entitlement and access-group permission must both permit an operation. Saved preferences, defaults and one-event overrides cannot expand access.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ACCESS-07",
          "text": "Parent-to-child inheritance, access to future children and multi-group conflict precedence remain explicit pending decisions; do not silently choose union, inheritance or deny precedence.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-SUBSCRIPTION",
      "name": "Entity subscriptions",
      "requirements": [
        {
          "ref": "COMMON-SUBSCRIPTION-01",
          "text": "An entity may subscribe to one engine, multiple engines or multiple suites. Store entitlements and effective dates in the database.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SUBSCRIPTION-02",
          "text": "Restrict architecture selection, navigation and data operations to subscribed capabilities, intersected with access permissions.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SUBSCRIPTION-03",
          "text": "Subscription scope is entity-specific; group administration cannot grant an unsubscribed capability.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-PREF",
      "name": "Preferences and defaults",
      "requirements": [
        {
          "ref": "COMMON-PREF-01",
          "text": "Store preferences in the database for forms, configuration selections, mappings, imports, Google Sheet connections, reports, dashboards and favorites.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-02",
          "text": "Always ask for explicit confirmation before saving or changing preferences. Configuration changes require their permitted administrator action and confirmation.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-03",
          "text": "Offer a one-event option without replacing saved settings. Store the execution's resolved configuration versions and temporary selections for traceability.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-04",
          "text": "Apply COS rules, then entity configuration, then permitted user preferences, then one-event selections. Later layers may customize only within earlier policy/security limits.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-05",
          "text": "Support entity defaults, permitted personal defaults and one-event choices. Defaults may cover navigation; record lists/status/department/role/group/location; report columns/filters/dates/sort/group; dashboard views/widgets; upload mode/mapping/key; Google Sheet references/range/headers; download format/scope; form defaults/dependencies.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-06",
          "text": "Show only applicable filters. Distinguish All permitted records, No selection and Blank value. Prefill does not imply permission or final write confirmation.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-PREF-07",
          "text": "Offer to save selected Google Sheet references and settings only after confirmation. Never store credentials in ordinary preference records.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-IMPORT",
      "name": "Bulk upload and templates",
      "requirements": [
        {
          "ref": "COMMON-IMPORT-01",
          "text": "Provide bulk create/update through Excel, CSV, PDF and Google Sheet input; support reusable per-component/entity mappings and configuration.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-02",
          "text": "Excel/CSV processing supports source sheet/header selection, CSV delimiters and value formats, mapping, preview, validation and row-level results.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-03",
          "text": "PDF processing supports extraction profile, filename/page/table-or-record traceability and review of uncertain extraction. Do not treat uncertain values as confirmed input.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-04",
          "text": "Download entity/component-specific Excel/CSV templates for bulk update, with configured fields, required unique-key fields and mapping information.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-05",
          "text": "Suggest close matching system fields for source headers in uploads and sync. Show suggestions; confirm ambiguous mappings. Field-header suggestions never automatically choose a target business record.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-06",
          "text": "Enforce current access, complete unique keys, duplicate checks and validation at execution for every input channel. Record import/sync run ID and row outcomes.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-IMPORT-07",
          "text": "Provide a one-event GUI path for the same operation without silently overwriting saved profiles.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-SHEET",
      "name": "Google Sheet input and output",
      "requirements": [
        {
          "ref": "COMMON-SHEET-01",
          "text": "Configure authorized spreadsheet, tab, range, headers, source-to-system mapping, key and permitted create/update mode for input synchronization.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-02",
          "text": "System remains authoritative. Source values do not bypass validation or become the owner of fields. Define source ingestion, duplicate processing and conflict behaviour explicitly.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-03",
          "text": "Export report data to an existing spreadsheet/tab/range or explicitly create a new spreadsheet/tab. No destination is chosen silently.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-04",
          "text": "Before exporting, support selected columns, filters, sorting and record scope; show destination, selected fields, filters and affected record count.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-05",
          "text": "Every export requires explicit Append or Clear old data and write confirmation, even when preferences prefill a choice.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-06",
          "text": "Append retains existing rows and adds selected records; show detected duplicate-key conflicts. Clear-and-write previews the exact tab/range to clear and requires explicit confirmation.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SHEET-07",
          "text": "Never silently clear an entire spreadsheet. Export only authorized fields/records. Saved preferences and one-event selections follow confirmation rules.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-EMAIL",
      "name": "Email extraction",
      "requirements": [
        {
          "ref": "COMMON-EMAIL-01",
          "text": "Configure authorized mailbox/source, sender, subject and relevant message headers. Email headers and attachment column headers are separate mapping concepts.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-EMAIL-02",
          "text": "Select email body and/or attachments; configure extraction profile for body, Excel, CSV or PDF and map results to the target component.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-EMAIL-03",
          "text": "Track message and attachment references to avoid duplicate processing. Reuse shared import validation, access, unique matching and row-result handling.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-EMAIL-04",
          "text": "Choose preview/review or an explicitly configured automatic processing mode; no mailbox, recurring job or automatic processing is activated by this design.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-REPORT",
      "name": "Reports and dashboards",
      "requirements": [
        {
          "ref": "COMMON-REPORT-01",
          "text": "Make reports configurable through shared reporting services over authorized datasets; do not expose unrestricted database columns.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-02",
          "text": "Users can add/remove/reorder permitted columns, set supported column filters/date ranges, sorting, grouping and approved calculations.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-03",
          "text": "Save multiple named report/dashboard views, selected widgets and layout as confirmed preferences. Sharing is limited to permitted users/groups.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-04",
          "text": "Support Excel, CSV and PDF downloads with selected columns, filters, sorting and record scope. Apply the same field/record access as interactive views.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-05",
          "text": "Support filtered report output to existing or explicitly new Google Sheet destinations using the mandatory append/clear confirmation process.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-06",
          "text": "Official controlled outputs retain required definitions while allowing permitted presentation changes. Personal preferences do not alter approved payroll meanings.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REPORT-07",
          "text": "Shared favorites/shortcuts open permitted components; employee self-service is a role-based workspace, not a duplicate business module.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-SEARCH",
      "name": "Search at every level",
      "requirements": [
        {
          "ref": "COMMON-SEARCH-01",
          "text": "Search suites, engines, modules, components, field names/labels/definitions, permitted data/values, reports, dashboards and saved views.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SEARCH-02",
          "text": "Support global permitted search or selected hierarchy/object/dataset scope; include search and filtering in dashboard views.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SEARCH-03",
          "text": "Show result type and hierarchy to distinguish similar names. Return only subscribed, authorized objects, fields, metadata and records.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-SEARCH-04",
          "text": "Search/filter defaults and saved selections must not widen access. Detailed ranking, indexing and performance strategy remain design work.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-ERROR",
      "name": "Configurable errors and source traceability",
      "requirements": [
        {
          "ref": "COMMON-ERROR-01",
          "text": "Entity administrators configure message templates with permitted placeholders; retain stable machine-readable error codes and internal diagnostics. Template changes cannot turn failure into success or suppress required gates.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-02",
          "text": "Missing key inputs identify the exact missing fields; missing source columns identify unmapped required key fields. Complete key with no match lists the key fields used, not fictitious missing values.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-03",
          "text": "Include available record type and permitted record ID (such as sys_emp_id), run/request ID, affected field and source reference. Do not invent missing record IDs.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-04",
          "text": "For Excel/CSV include filename, source sheet where applicable, row and source column. For Google Sheets include spreadsheet, tab, row/cell and a permitted source link when available.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-05",
          "text": "For PDF include filename, page and extracted table/record reference. For email include message reference, permitted subject and attachment. For GUI/API include form/request reference and affected field.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-06",
          "text": "Support placeholders such as record_type, missing_fields, key_fields and row_number. Mask sensitive values and do not disclose protected record existence/details through errors.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-ERROR-07",
          "text": "Show users what failed, where it failed and how to locate it. Examples are illustrative, not live record data.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    },
    {
      "ref": "COMMON-REUSE",
      "name": "Shared architecture and history",
      "requirements": [
        {
          "ref": "COMMON-REUSE-01",
          "text": "Reuse services, functions, APIs/DTO infrastructure, frontend controls, validation, approvals, document metadata, audit, imports, sync, reporting and search across suites/modules/components.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REUSE-02",
          "text": "Domain-specific semantics, authoritative writers, rules and persistence remain owned by the relevant domain. Reuse does not imply one universal employee/vendor/aggregator table.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REUSE-03",
          "text": "Keep approval, implementation, verification and publication statuses separate. No shared engine/module placement is silently allocated.",
          "status": "Recorded requirement/design direction; implementation not verified"
        },
        {
          "ref": "COMMON-REUSE-04",
          "text": "Configuration and preferences are logical database-backed designs; detailed APIs, DTOs, migrations, physical table names and acceptance tests remain to be designed.",
          "status": "Recorded requirement/design direction; implementation not verified"
        }
      ]
    }
  ],
  "pending": [
    "Meaning of Number in employee candidate key fields",
    "Actual default uniqueness combinations per entity and record type",
    "Permission inheritance, future-child policy and multi-group conflicts",
    "Exact shared capability architectural placement",
    "Detailed source-conflict, automated extraction, PDF review and sync execution policies"
  ],
