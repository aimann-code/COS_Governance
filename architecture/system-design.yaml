  "metadata_runtime": {
    "principle": "Versioned metadata + configuration -> shared service runtime -> typed domain handler -> domain-owned persistence (metadata-driven-component-standard).",
    "metadata_kinds": [
      "object",
      "field",
      "form",
      "rule",
      "workflow",
      "permission",
      "data contract",
      "API",
      "integration",
      "event",
      "audit",
      "report",
      "test"
    ],
    "lifecycle": [
      [
        "Draft",
        "Editable by entity administrator; validated against JSON Schema and reviewed field types"
      ],
      [
        "Review",
        "Preview of generated screen/import/report; impact on existing records shown"
      ],
      [
        "Active",
        "Immutable version; exactly one active version per object and scope"
      ],
      [
        "Retired",
        "Kept for history; records pinned to it remain readable"
      ]
    ],
    "rules": [
      "Every transaction, draft and import run stores the config version it used (DRAFT-BE-R11).",
      "Active versions are immutable; changes create a new version and go through confirmation (config.confirmation).",
      "Runtime caches config by (scope, object, version); activation publishes an outbox event that invalidates caches.",
      "Rollback means re-activating an earlier version, never editing history.",
      "Metadata may select reviewed field types, validators, layouts, uniqueness fields, permissions, mappings and report columns; it may not contain executable code, arbitrary SQL or new storage structures (DRAFT-BE-R10).",
      "Needs beyond metadata (new algorithms, new tables) go through code review and Flyway migration."
    ],
    "data_placement": [
      [
        "Core business fields (identity, keys, money, dates, status)",
        "Typed columns in the owning engine schema"
      ],
      [
        "Entity-configured additional fields",
        "Typed values referencing field-definition versions (e.g. emp.emp_field_value) or JSONB validated by schema"
      ],
      [
        "Metadata definitions",
        "config schema tables with JSONB payload plus typed key columns"
      ],
      [
        "History and audit",
        "audit.change_event and per-domain history, written in the same transaction"
      ]
    ]
  },
