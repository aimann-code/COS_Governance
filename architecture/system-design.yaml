  "integration_patterns": [
    {
      "pattern": "File import",
      "used_for": "Aggregator payouts (Ownly), bulk employee upload, Attendo exports",
      "flow": "Upload/source -> preserve raw file -> profile parse -> stage rows (integration.import_row) -> mapping -> preview -> confirmed execute -> domain write + audit -> errors traceable",
