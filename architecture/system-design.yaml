    {
      "id": "query-engine",
      "title": "Query engine",
      "summary": "Lists, search, reports and exports go through one QueryService that compiles view metadata into parameterised SQL. Users and metadata never supply raw SQL.",
      "bullets": [
        "Only columns registered in metadata or a governed mart can be selected, filtered or sorted.",
        "Scope predicates (entity, hierarchy, record rules) are always added by the service, never by the caller.",
        "Field permissions are applied twice: columns are dropped from the query and values are masked in the result.",
        "Filters use a fixed operator set (equals, in, range, contains, is blank); keyset paging with a configured page-size limit.",
        "Reports read virtual marts, not engine tables (VIRTUAL-MART-01); heavy marts may be materialised and refreshed by the worker."
      ]
    },
    {
      "id": "data-storage",
      "title": "Data storage patterns",
      "summary": "Metadata drives behaviour, but data stays in real typed tables so it remains correct, fast and reportable.",
      "tables": [
        {
          "headers": [
            "Data",
            "Pattern"
          ],
          "rows": [
            [
              "Engine core fields",
              "Typed columns in the engine's schema, created by Flyway migrations declared in the manifest"
            ],
            [
              "Entity-added company fields",
              "Typed value table per object (for example emp.emp_field_value) keyed by field-definition version; JSONB with generated indexes is the alternative (SD-P11)"
            ],
            [
              "Identifiers and secrets",
              "Encrypted value plus scoped HMAC fingerprint for matching; masked on read"
            ],
            [
              "Relations",
              "Foreign keys inside one engine; cross-engine links store a typed reference checked through the owning engine's API"
            ],
            [
              "History",
              "Per-object history rows plus audit.change_event, written in the same transaction"
            ],
            [
              "Time-varying facts",
              "Effective-dated rows (from, to) such as assignments and employment periods"
            ],
            [
              "Identity",
              "UUID primary key, business number from NumberingService, scope_id on every row, composite (scope_id, id) keys"
            ],
            [
              "Deletion",
              "Status changes and retention policy; no hard delete of business records"
            ]
          ]
        }
      ]
    },
    {
      "id": "workflow",
      "title": "Workflow and approvals",
      "summary": "Status changes and approvals are metadata: states, transitions, guards and approver rules. The WorkflowService runs them through the command pipeline so every transition is checked, audited and published as an event.",
      "bullets": [
        "Each object may reference one workflow; transitions are exposed as actions (/actions/{action}).",
        "Approver rules use the operation-specific authority matrix (DRAFT-BE-R07): for example HR approves employee changes, an administrator approves configuration.",
        "Guards are declarative rules; anything needing calculation is a handler hook.",
        "Long-running multi-party flows are the trigger to evaluate an external workflow engine; until then the built-in state machine is enough."
      ],
      "diagrams": [
        "employee-workflow"
      ]
    },
