    {
      "id": "core-and-engines",
      "title": "COS Core and plug-in engines",
      "summary": "COS is a small core that knows nothing about employees, vendors or journals, plus engines that plug into it. The core runs metadata; engines supply metadata and the code metadata cannot express. The plug-in unit is an engine; its modules and components are registered inside its package.",
      "tables": [
        {
          "title": "Which suites are core and which plug in",
          "headers": [
            "Layer",
            "Suites",
            "Built how"
          ],
          "rows": [
            [
              "COS Core",
              "Technology & Platform Services, Platform Governance, Integration, Common Data",
              "Built once as platform services; only the slices a real engine needs, when it needs them"
            ],
            [
              "Plug-in engines",
              "Enterprise Management (HRMS, Finance, ...), Product & Commercial, Supply & Operations, Sales & Customer",
              "One package per engine; mostly metadata plus a few domain handlers"
            ],
            [
              "Consumers",
              "AI & Analytics",
              "Plug-in engines that read governed virtual marts and events; never other engines' tables"
            ]
          ]
        },
        {
          "title": "Engine lifecycle",
          "headers": [
            "State",
            "Meaning",
            "Who moves it"
          ],
          "rows": [
            [
              "Available",
              "Package is in the release but not installed in this environment",
              "Release pipeline"
            ],
            [
              "Installed",
              "Schema migrated, product metadata loaded, handlers registered; visible to nobody",
              "Deployment step"
            ],
            [
              "Enabled",
              "Turned on for an entity through an entitlement with effective dates",
              "Platform administrator"
            ],
            [
              "Upgrading",
              "New package version migrating schema and metadata; old version still serving",
              "Deployment step"
            ],
            [
              "Disabled",
              "Entitlement ended for an entity; data kept read-only per retention policy",
              "Platform administrator"
            ],
            [
              "Retired",
              "Removed from the release after data disposition is approved",
              "Explicit decision"
            ]
          ]
        }
      ],
      "bullets": [
        "An engine depends on the core SDK only; it never imports another engine's code or reads another engine's tables.",
        "Engines talk through published APIs and outbox events (for example Finance listens for hrms.employment.exited to start final settlement).",
        "Nothing enters the core until a module needs it; anything specific to one domain stays in that engine.",
        "A second engine (Finance: Ownly sales-to-journal, or Vendor master) is the test of the core: if it needs core changes, fix the contract, not the module."
      ],
      "diagrams": [
        "core-engines",
        "engine-lifecycle"
      ]
    },
