  "integration_patterns": [
    {
      "pattern": "File import",
      "used_for": "Aggregator payouts (Ownly), bulk employee upload, Attendo exports",
      "flow": "Upload/source -> preserve raw file -> profile parse -> stage rows (integration.import_row) -> mapping -> preview -> confirmed execute -> domain write + audit -> errors traceable",
      "idempotency": "integration.processed_source hash per source version"
    },
    {
      "pattern": "API pull",
      "used_for": "Petpooja, Zoho Books, Razorpay, Attendo (once verified)",
      "flow": "Scheduled worker job -> adapter with approved connection -> stage -> same mapping/validation path as file import",
      "idempotency": "Provider IDs mapped in id-map tables; sync_run checkpoints"
    },
    {
      "pattern": "API push",
      "used_for": "Zoho journals, payouts",
      "flow": "Domain event -> outbox -> worker -> external call with idempotency key -> record response; unknown responses reconciled before retry",
      "idempotency": "Payload hash plus external reference"
    },
    {
      "pattern": "Webhook in",
      "used_for": "Payment/settlement notifications",
      "flow": "Verify signature -> store raw event -> process asynchronously",
      "idempotency": "Provider event ID"
    },
    {
      "pattern": "Google Sheet sync",
      "used_for": "Interim working sheets and outputs",
      "flow": "Preview exact ranges -> explicit append/clear confirmation -> write -> read back counts",
      "idempotency": "sync_run bound to confirmation"
    }
  ],
  "security": [
    "OIDC sign-in with MFA for administrators; API validates tokens and resolves principal server-side.",
    "Authorization layers: entitlement -> access group -> hierarchy scope -> record -> field (AccessService).",
    "Encrypt sensitive fields (identity, bank, documents) at application level; keys in a secret manager; baseline already encrypts profile payloads and documents.",
    "Secrets never in GitHub, preferences or metadata; external connections referenced by approved connection IDs.",
    "Every mutation writes audit and history in the same transaction; logs redact secrets and documents.",
    "Exports and Sheet outputs pass the same authorization as screens; masked values stay masked."
  ],
