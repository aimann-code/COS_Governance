    {
      "id": "metadata-layers",
      "title": "Metadata layering and resolution",
      "summary": "Configuration comes from five layers. Each later layer may only narrow or customise within what earlier layers allow, never widen access or unlock a locked field. Resolution produces one immutable snapshot per entity, object and version.",
      "tables": [
        {
          "headers": [
            "Order",
            "Layer",
            "Authored where",
            "May change"
          ],
          "rows": [
            [
              "1",
              "Platform (core)",
              "Core code and core metadata in git",
              "Field types, platform-locked identity and security fields, global rules"
            ],
            [
              "2",
              "Engine product",
              "Engine package metadata in git",
              "Objects, core fields, default forms, views, workflows, permissions"
            ],
            [
              "3",
              "Entity configuration",
              "COS Studio, stored in the database",
              "Company fields, labels, required/optional, order, unique keys, numbering, access groups"
            ],
            [
              "4",
              "User preference",
              "Saved by the user with confirmation",
              "Columns, filters, sort, defaults within their permissions"
            ],
            [
              "5",
              "One-event choice",
              "Selected for a single run",
              "Temporary selections; recorded with the run, not saved"
            ]
          ]
        }
      ],
      "bullets": [
        "Resolution order matches the approved common requirement: COS rules, then entity configuration, then user preferences, then one-event selections.",
        "Every resolved snapshot has a hash; transactions, drafts and import runs store the snapshot they used.",
        "Locked items (identity, scope, security, relationship keys) cannot be overridden by layers 3 to 5."
      ],
      "diagrams": [
        "metadata-layers"
      ]
    },
    {
      "id": "metadata-storage",
      "title": "Metadata storage and versioning",
      "summary": "All metadata shares one versioning envelope in a meta schema. The proposed config, auth, integration and report tables stay as the typed stores each service queries; the envelope adds package, version, layer and activation.",
      "tables": [
        {
          "headers": [
            "Table",
            "Holds"
          ],
          "rows": [
            [
              "meta.package",
              "Installed engine packages and versions"
            ],
            [
              "meta.definition",
              "One row per metadata item: type, code, engine, owner layer"
            ],
            [
              "meta.definition_version",
              "Immutable versions: JSON body validated by the type's JSON Schema, hash, author, created time"
            ],
            [
              "meta.activation",
              "Which version is active for which entity scope, with effective dates and approval reference"
            ],
            [
              "meta.snapshot",
              "Resolved configuration per entity, object and version set, with hash; the cache source"
            ],
            [
              "config.* / auth.* / integration.* / report.*",
              "Typed projections each service queries (field_def, unique_rule, access_group, import profile, mart_def ...), keyed to the definition version"
            ]
          ]
        }
      ],
      "bullets": [
        "Active versions are immutable; a change creates a new version. Rollback re-activates an earlier version.",
        "Records keep the snapshot hash they were written with, so old records stay readable after fields change.",
        "Disabling a field hides it from new input; it never deletes stored values."
      ],
      "diagrams": [
        "meta-erd"
      ]
    },
