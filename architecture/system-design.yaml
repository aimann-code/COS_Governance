    },
    {
      "pattern": "API pull",
      "used_for": "Petpooja, Zoho Books, Razorpay, Attendo (once verified)",
      "flow": "Scheduled worker job -> adapter with approved connection -> stage -> same mapping/validation path as file import",
      "idempotency": "Provider IDs mapped in id-map tables; sync_run checkpoints"
    },
    {
      "pattern": "API push",
      "used_for": "Zoho journals, payouts",
      "flow": "Domain event -> outbox -> worker -> external call with idempotency key -> record response; unknown responses reconciled before retry",
      "idempotency": "Payload hash plus external reference"
    },
    {
      "pattern": "Webhook in",
      "used_for": "Payment/settlement notifications",
      "flow": "Verify signature -> store raw event -> process asynchronously",
      "idempotency": "Provider event ID"
    },
    {
      "pattern": "Google Sheet sync",
      "used_for": "Interim working sheets and outputs",
      "flow": "Preview exact ranges -> explicit append/clear confirmation -> write -> read back counts",
      "idempotency": "sync_run bound to confirmation"
    }
