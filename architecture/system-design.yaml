    {
      "id": "runtime-pipeline",
      "title": "Runtime command pipeline",
      "summary": "Every write, from screen, API, import or Sheet sync, runs the same pipeline. Domain handlers plug into fixed hook points; they never bypass access, validation, uniqueness or audit.",
      "tables": [
        {
          "headers": [
            "Stage",
            "Done by",
            "Fails with"
          ],
          "rows": [
            [
              "1. Authenticate",
              "Security filter",
              "401"
            ],
            [
              "2. Resolve entity scope and principal",
              "Core runtime",
              "403 when the entity is not permitted"
            ],
            [
              "3. Check entitlement",
              "SubscriptionService",
              "403 capability not subscribed"
            ],
            [
              "4. Load pinned config snapshot",
              "ConfigService",
              "409 when the client's config version is stale"
            ],
            [
              "5. Authorise object, action and fields",
              "AccessService",
              "403 with no detail of protected fields"
            ],
            [
              "6. Validate types and rules",
              "RuleService",
              "422 with field-level error codes"
            ],
            [
              "7. Duplicate check and key claim",
              "UniqueKeyService",
              "409 duplicate with masked match reference"
            ],
            [
              "8. Domain handler: beforeSave",
              "Engine handler",
              "422 domain rule"
            ],
            [
              "9. Persist record, history, audit, outbox in one transaction",
              "Repository + core",
              "409 on optimistic-lock conflict"
            ],
            [
              "10. Domain handler: afterCommit",
              "Engine handler via outbox",
              "Retried; never undoes the commit"
            ],
            [
              "11. Respond with masked view",
              "Core runtime",
              "-"
            ]
          ]
        }
