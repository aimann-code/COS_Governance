      "id": "metadata-promotion",
      "title": "Metadata lifecycle and promotion",
      "summary": "Two paths change metadata. Product metadata ships with code through git and CI. Entity configuration is changed in COS Studio by administrators and goes through draft, preview, impact check and approval.",
      "tables": [
        {
          "headers": [
            "Path",
            "Steps",
            "Guard"
          ],
          "rows": [
            [
              "Product (layers 1-2)",
              "Edit metadata files in the engine package, pull request, CI validates schemas and references, release, install step loads new versions",
              "Code review, CI, explicit release approval"
            ],
            [
              "Entity configuration (layer 3)",
              "Draft in Studio, validate, preview the generated form or import, impact check on existing records, submit, administrator approves, activate",
              "Authority matrix; minimum two-field keys; collision scan before activation"
            ],
            [
              "Between environments",
              "Export entity configuration as a signed package, review the diff, import into staging then production",
              "Same approval as a configuration change"
            ]
          ]
        }
      ],
      "bullets": [
        "COS_Governance stays the source for definitions and standards; engine product metadata lives in the application repository and is generated into the catalogue, not copied by hand.",
        "No configuration change rewrites history or migrates data silently; changes needing new columns or algorithms go through code review and Flyway."
      ],
      "diagrams": [
